<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Feed</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- iOS Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clean Feed">
  <link rel="apple-touch-icon" href="/icon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #e7e9ea;
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      padding: 16px 0;
      border-bottom: 1px solid #2f3336;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .tagline {
      font-size: 14px;
      color: #71767b;
      margin-top: 4px;
    }

    .tagline-link {
      color: #1d9bf0;
      text-decoration: none;
    }

    .tagline-link:hover {
      text-decoration: underline;
    }

    .meta {
      font-size: 13px;
      color: #71767b;
      margin-top: 4px;
    }

    .loading, .error {
      text-align: center;
      padding: 40px;
      color: #71767b;
    }

    .error {
      color: #f4212e;
    }

    .post {
      padding: 16px 0;
      border-bottom: 1px solid #2f3336;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .username {
      font-weight: 700;
      color: #e7e9ea;
      text-decoration: none;
    }

    .username:hover {
      text-decoration: underline;
    }

    .time {
      color: #71767b;
      font-size: 14px;
    }

    .post-content {
      font-size: 15px;
      word-wrap: break-word;
    }

    .post-content a {
      color: #1d9bf0;
      text-decoration: none;
    }

    .post-content a:hover {
      text-decoration: underline;
    }

    .post-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: #71767b;
      text-decoration: none;
    }

    .post-link:hover {
      text-decoration: underline;
    }

    .post-images {
      margin-top: 12px;
    }

    .post-image {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 8px;
    }

    .quoted-tweet {
      display: block;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #2f3336;
      border-radius: 12px;
      background: #16181c;
      text-decoration: none;
      transition: background 0.2s;
    }

    .quoted-tweet:hover {
      background: #1d1f23;
    }

    .quoted-tweet .quoted-header {
      margin-bottom: 4px;
    }

    .quoted-tweet .quoted-username {
      font-weight: 700;
      color: #e7e9ea;
      text-decoration: none;
      font-size: 14px;
    }

    .quoted-tweet .quoted-username:hover {
      text-decoration: underline;
    }

    .quoted-tweet .quoted-text {
      font-size: 14px;
      color: #e7e9ea;
      word-wrap: break-word;
    }

    .quoted-tweet .quoted-text a {
      color: #1d9bf0;
      text-decoration: none;
    }

    .quoted-tweet .quoted-text a:hover {
      text-decoration: underline;
    }

    .quoted-tweet .quoted-link {
      font-size: 13px;
      color: #1d9bf0;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #71767b;
    }

    .refresh-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #1a8cd8;
    }

    .refresh-btn:disabled {
      background: #1d9bf0;
      opacity: 0.5;
      cursor: not-allowed;
    }

    .following-section {
      min-height: 100vh;   /* fallback for older browsers */
      min-height: 100dvh;  /* dynamic viewport height - mobile friendly */
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #2f3336;
    }

    .following-section h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #71767b;
    }

    .following-section ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .following-section li a {
      color: #1d9bf0;
      text-decoration: none;
      font-size: 14px;
    }

    .following-section li a:hover {
      text-decoration: underline;
    }

    .dev-stats {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #2f3336;
      font-size: 12px;
      color: #71767b;
      text-align: center;
    }

    .dev-stats a {
      color: #71767b;
      text-decoration: none;
    }

    .dev-stats a:hover {
      text-decoration: underline;
      color: #1d9bf0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Clean Feed</h1>
    <p class="tagline">Tweets you <a href="#following" class="tagline-link">care about</a>. Nothing else.</p>
    <p class="meta" id="status">Loading...</p>
  </header>

  <main id="feed">
    <div class="loading">Fetching posts...</div>
  </main>

  <button class="refresh-btn" id="refresh" onclick="loadFeed(true)">Refresh</button>

  <footer id="following" class="following-section">
    <h2>Following</h2>
    <ul id="accounts-list"></ul>
  </footer>

  <div id="dev-stats" class="dev-stats"></div>

  <script>
    function timeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return 'now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h`;
      const days = Math.floor(hours / 24);
      return `${days}d`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatText(text, urlMap = {}) {
      // Escape HTML first (prevent XSS)
      let formatted = escapeHtml(text);

      // Expand t.co URLs to real URLs and make clickable
      formatted = formatted.replace(
        /(https?:\/\/[^\s<]+)/g,
        (match) => {
          const realUrl = urlMap[match] || match;
          // Show shortened display URL
          const displayUrl = realUrl.replace(/^https?:\/\//, '').substring(0, 40);
          return `<a href="${realUrl}" target="_blank">${displayUrl}${realUrl.length > 47 ? '...' : ''}</a>`;
        }
      );

      // Convert @mentions to profile links
      formatted = formatted.replace(
        /@(\w+)/g,
        '<a href="https://x.com/$1" target="_blank">@$1</a>'
      );

      // Convert #hashtags to search links
      formatted = formatted.replace(
        /#(\w+)/g,
        '<a href="https://x.com/search?q=%23$1" target="_blank">#$1</a>'
      );

      // Convert newlines to <br>
      formatted = formatted.replace(/\n/g, '<br>');

      return formatted;
    }

    function renderQuotedTweet(quoted) {
      if (!quoted || !quoted.link) return '';

      // Simple link format - avoids issues with videos, long text, etc.
      const previewText = quoted.text
        ? escapeHtml(quoted.text.substring(0, 100)) + (quoted.text.length > 100 ? '...' : '')
        : '';

      return `
        <a href="${quoted.link}" target="_blank" class="quoted-tweet">
          <div class="quoted-header">
            <span class="quoted-username">@${quoted.username || 'tweet'}</span>
          </div>
          ${previewText ? `<div class="quoted-text">${previewText}</div>` : ''}
          <div class="quoted-link">View quoted tweet →</div>
        </a>
      `;
    }

    function renderPost(post) {
      const time = timeAgo(new Date(post.date));
      const images = (post.images || []).map(url =>
        `<img class="post-image" src="${url}" alt="" loading="lazy">`
      ).join('');

      return `
        <article class="post">
          <div class="post-header">
            <a class="username" href="https://x.com/${post.username}" target="_blank">@${post.username}</a>
            <span class="time">${time}</span>
          </div>
          <div class="post-content">${formatText(post.text, post.urlMap || {})}</div>
          ${renderQuotedTweet(post.quotedTweet)}
          ${images ? `<div class="post-images">${images}</div>` : ''}
          <a class="post-link" href="${post.link}" target="_blank">View on X</a>
        </article>
      `;
    }

    const CACHE_KEY = 'cleanfeed_cache';
    const CACHE_MAX_AGE = 24 * 60 * 60 * 1000; // 24 hours

    function getCachedData() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (!cached) return null;
        return JSON.parse(cached);
      } catch {
        return null;
      }
    }

    function setCachedData(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      } catch {
        // localStorage full or unavailable
      }
    }

    function formatFetchTime(date) {
      return date.toLocaleString(undefined, {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    function renderAccounts(accounts) {
      const list = document.getElementById('accounts-list');
      list.innerHTML = accounts.map(username =>
        `<li><a href="https://x.com/${username}" target="_blank">@${username}</a></li>`
      ).join('');
    }

    function renderDevStats(meta, cacheSource = 'fresh') {
      const stats = document.getElementById('dev-stats');
      const tweets = meta?.tweetsFetched || 0;
      // CDN cache hit = no API cost; otherwise show actual cost
      const cost = cacheSource === 'cdn' ? '$0.0000' : (meta?.estimatedCost || '$0.0000');
      stats.innerHTML = `<a href="/api/feed" target="_blank">${tweets} tweets · ${cost} · ${cacheSource}</a>`;

      // Fetch and display balance
      fetch('/api/balance')
        .then(r => r.json())
        .then(data => {
          if (data.balance) {
            stats.innerHTML = `<a href="/api/feed" target="_blank">${tweets} tweets · ${cost} · ${cacheSource} · Balance: ${data.balance}</a>`;
          }
        })
        .catch(() => {}); // Silently fail
    }

    function renderFeed(data, status, feed, cacheSource = 'fresh') {
      if (data.posts.length === 0) {
        feed.innerHTML = '<div class="empty">No posts from the last 24 hours.</div>';
      } else {
        feed.innerHTML = data.posts.map(renderPost).join('');
      }
      const updated = new Date(data.updated);
      status.textContent = `${data.count} posts from last 24h · Updated ${formatFetchTime(updated)}`;
      renderDevStats(data._meta, cacheSource);
    }

    async function loadFeed(forceRefresh = false) {
      const feed = document.getElementById('feed');
      const status = document.getElementById('status');
      const refreshBtn = document.getElementById('refresh');
      const cached = getCachedData();

      // Force refresh = use streaming API for live progress
      if (forceRefresh) {
        feed.innerHTML = '<div class="loading">Fetching posts...</div>';
        refreshBtn.disabled = true;
        loadFeedStreaming(feed, status, refreshBtn, cached);
        return;
      }

      // Normal load: try server-side cached response first
      // Check localStorage cache while we fetch
      if (cached) {
        renderFeed(cached, status, feed, 'local');
        renderAccounts(cached._meta?.accounts || []);
      } else {
        feed.innerHTML = '<div class="loading">Fetching posts...</div>';
      }

      refreshBtn.disabled = true;

      try {
        const response = await fetch('/api/feed');
        const cacheStatus = response.headers.get('x-vercel-cache');
        const data = await response.json();

        // Determine cache source for display
        const cacheSource = cacheStatus === 'HIT' ? 'cdn' : 'fresh';

        renderFeed(data, status, feed, cacheSource);
        renderAccounts(data._meta?.accounts || []);
        setCachedData(data);
      } catch (err) {
        if (!cached) {
          feed.innerHTML = `<div class="error">Failed to load feed: ${err.message}</div>`;
          status.textContent = 'Error loading feed';
        }
      }

      refreshBtn.disabled = false;
    }

    function loadFeedStreaming(feed, status, refreshBtn, cached) {
      const allPosts = [];
      let accounts = [];

      try {
        const eventSource = new EventSource('/api/feed-stream');

        eventSource.onmessage = (event) => {
          const data = JSON.parse(event.data);

          if (data.type === 'start') {
            accounts = data.accounts;
            renderAccounts(accounts);
            status.textContent = `Loading ${data.total} accounts...`;
            feed.innerHTML = '';
          }

          if (data.type === 'progress') {
            status.textContent = `Fetching @${data.username}... (${data.current}/${data.total})`;
          }

          if (data.type === 'posts') {
            allPosts.push(...data.posts);
            feed.innerHTML = allPosts.map(renderPost).join('');
          }

          if (data.type === 'complete') {
            eventSource.close();
            const meta = { accounts, tweetsFetched: data.tweetsFetched, estimatedCost: data.estimatedCost };
            const cacheData = {
              updated: new Date().toISOString(),
              count: data.count,
              posts: allPosts,
              _meta: meta
            };
            setCachedData(cacheData);
            status.textContent = `${data.count} posts from last 24h · Updated ${formatFetchTime(new Date())}`;
            renderDevStats(meta, 'fresh');
            refreshBtn.disabled = false;

            if (allPosts.length === 0) {
              feed.innerHTML = '<div class="empty">No posts from the last 24 hours.</div>';
            }
          }

          if (data.type === 'error') {
            eventSource.close();
            throw new Error(data.message);
          }
        };

        eventSource.onerror = () => {
          eventSource.close();
          if (allPosts.length === 0) {
            if (cached) {
              renderFeed(cached, status, feed, 'local');
              status.textContent = `${cached.count} posts from last 24h · Updated ${formatFetchTime(new Date(cached.updated))} (refresh failed)`;
            } else {
              feed.innerHTML = '<div class="error">Failed to load feed</div>';
              status.textContent = 'Error loading feed';
            }
          }
          refreshBtn.disabled = false;
        };
      } catch (err) {
        feed.innerHTML = `<div class="error">Failed to load feed: ${err.message}</div>`;
        status.textContent = 'Error loading feed';
        refreshBtn.disabled = false;
      }
    }

    loadFeed();
  </script>
</body>
</html>
