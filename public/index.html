<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #e7e9ea;
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      padding: 16px 0;
      border-bottom: 1px solid #2f3336;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .meta {
      font-size: 13px;
      color: #71767b;
      margin-top: 4px;
    }

    .loading, .error {
      text-align: center;
      padding: 40px;
      color: #71767b;
    }

    .error {
      color: #f4212e;
    }

    .post {
      padding: 16px 0;
      border-bottom: 1px solid #2f3336;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .username {
      font-weight: 700;
      color: #e7e9ea;
      text-decoration: none;
    }

    .username:hover {
      text-decoration: underline;
    }

    .time {
      color: #71767b;
      font-size: 14px;
    }

    .post-content {
      font-size: 15px;
      word-wrap: break-word;
    }

    .post-content a {
      color: #1d9bf0;
      text-decoration: none;
    }

    .post-content a:hover {
      text-decoration: underline;
    }

    .post-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: #71767b;
      text-decoration: none;
    }

    .post-link:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #71767b;
    }

    .refresh-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #1a8cd8;
    }

    .refresh-btn:disabled {
      background: #1d9bf0;
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>Clean Feed</h1>
    <p class="meta" id="status">Loading...</p>
  </header>

  <main id="feed">
    <div class="loading">Fetching posts...</div>
  </main>

  <button class="refresh-btn" id="refresh" onclick="loadFeed(true)">Refresh</button>

  <script>
    function timeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return 'now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h`;
      const days = Math.floor(hours / 24);
      return `${days}d`;
    }

    function renderPost(post) {
      const time = timeAgo(new Date(post.date));
      return `
        <article class="post">
          <div class="post-header">
            <a class="username" href="https://twitter.com/${post.username}" target="_blank">@${post.username}</a>
            <span class="time">${time}</span>
          </div>
          <div class="post-content">${post.text}</div>
          <a class="post-link" href="${post.link}" target="_blank">View on X</a>
        </article>
      `;
    }

    const CACHE_KEY = 'cleanfeed_cache';
    const CACHE_MAX_AGE = 24 * 60 * 60 * 1000; // 24 hours

    function getCachedData() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (!cached) return null;
        return JSON.parse(cached);
      } catch {
        return null;
      }
    }

    function setCachedData(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      } catch {
        // localStorage full or unavailable
      }
    }

    function formatLastUpdated(date) {
      const hours = Math.floor((Date.now() - date) / (1000 * 60 * 60));
      if (hours < 1) return 'Updated just now';
      if (hours === 1) return 'Updated 1 hour ago';
      if (hours < 24) return `Updated ${hours} hours ago`;
      const days = Math.floor(hours / 24);
      return `Updated ${days} day${days > 1 ? 's' : ''} ago`;
    }

    function renderFeed(data, status, feed) {
      if (data.posts.length === 0) {
        feed.innerHTML = '<div class="empty">No posts in the last 24 hours.</div>';
      } else {
        feed.innerHTML = data.posts.map(renderPost).join('');
      }
      const updated = new Date(data.updated);
      status.textContent = `${data.count} posts · ${formatLastUpdated(updated)}`;
    }

    async function loadFeed(forceRefresh = false) {
      const feed = document.getElementById('feed');
      const status = document.getElementById('status');
      const refreshBtn = document.getElementById('refresh');

      // Check cache first (unless force refresh)
      const cached = getCachedData();
      if (cached && !forceRefresh) {
        const cacheAge = Date.now() - new Date(cached.updated).getTime();
        renderFeed(cached, status, feed);

        // If cache is fresh enough, don't fetch
        if (cacheAge < CACHE_MAX_AGE) {
          return;
        }
        // Cache is stale, fetch in background
        status.textContent += ' (refreshing...)';
      } else {
        feed.innerHTML = '<div class="loading">Fetching posts...</div>';
      }

      refreshBtn.disabled = true;

      try {
        const res = await fetch('/api/feed');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        setCachedData(data);
        renderFeed(data, status, feed);
      } catch (err) {
        if (!cached) {
          feed.innerHTML = `<div class="error">Failed to load feed: ${err.message}</div>`;
          status.textContent = 'Error loading feed';
        } else {
          // Keep showing cached data on error
          status.textContent = `${cached.count} posts · ${formatLastUpdated(new Date(cached.updated))} (refresh failed)`;
        }
      } finally {
        refreshBtn.disabled = false;
      }
    }

    loadFeed();
  </script>
</body>
</html>
