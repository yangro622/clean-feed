<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #e7e9ea;
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      padding: 16px 0;
      border-bottom: 1px solid #2f3336;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .meta {
      font-size: 13px;
      color: #71767b;
      margin-top: 4px;
    }

    .loading, .error {
      text-align: center;
      padding: 40px;
      color: #71767b;
    }

    .error {
      color: #f4212e;
    }

    .post {
      padding: 16px 0;
      border-bottom: 1px solid #2f3336;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .username {
      font-weight: 700;
      color: #e7e9ea;
      text-decoration: none;
    }

    .username:hover {
      text-decoration: underline;
    }

    .time {
      color: #71767b;
      font-size: 14px;
    }

    .post-content {
      font-size: 15px;
      word-wrap: break-word;
    }

    .post-content a {
      color: #1d9bf0;
      text-decoration: none;
    }

    .post-content a:hover {
      text-decoration: underline;
    }

    .post-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: #71767b;
      text-decoration: none;
    }

    .post-link:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #71767b;
    }

    .refresh-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #1a8cd8;
    }

    .refresh-btn:disabled {
      background: #1d9bf0;
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>Clean Feed</h1>
    <p class="meta" id="status">Loading...</p>
  </header>

  <main id="feed">
    <div class="loading">Fetching posts...</div>
  </main>

  <button class="refresh-btn" id="refresh" onclick="loadFeed()">Refresh</button>

  <script>
    function timeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return 'now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h`;
      const days = Math.floor(hours / 24);
      return `${days}d`;
    }

    function renderPost(post) {
      const time = timeAgo(new Date(post.date));
      return `
        <article class="post">
          <div class="post-header">
            <a class="username" href="https://twitter.com/${post.username}" target="_blank">@${post.username}</a>
            <span class="time">${time}</span>
          </div>
          <div class="post-content">${post.html || post.text}</div>
          <a class="post-link" href="${post.link}" target="_blank">View on X</a>
        </article>
      `;
    }

    async function loadFeed() {
      const feed = document.getElementById('feed');
      const status = document.getElementById('status');
      const refreshBtn = document.getElementById('refresh');

      refreshBtn.disabled = true;
      feed.innerHTML = '<div class="loading">Fetching posts...</div>';

      try {
        const res = await fetch('/api/feed');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();

        if (data.posts.length === 0) {
          feed.innerHTML = '<div class="empty">No posts in the last 24 hours.</div>';
        } else {
          feed.innerHTML = data.posts.map(renderPost).join('');
        }

        const updated = new Date(data.updated);
        status.textContent = `${data.count} posts · Updated ${updated.toLocaleTimeString()}`;
      } catch (err) {
        feed.innerHTML = `<div class="error">Failed to load feed: ${err.message}</div>`;
        status.textContent = 'Error loading feed';
      } finally {
        refreshBtn.disabled = false;
      }
    }

    loadFeed();
  </script>
</body>
</html>
